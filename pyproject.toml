[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lablogger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest", "ruff"]

[project.scripts]
lablogger = "lablogger.cli:main"
lablogger-gui = "lablogger.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]